# The host runs Docker without iptables (nftables), so the service uses the host network and
# listens on localhost only; Caddy in front of it holds TLS.
services:
  cloud:
    build:
      context: ./src
      network: host
    image: voicefn-cloud
    network_mode: host
    env_file:
      - path: .env
        required: false
    environment:
      LISTEN: 127.0.0.1:8090
      GOMEMLIMIT: 50MiB
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 64m
    restart: unless-stopped
