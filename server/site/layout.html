{{define "layout"}}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
<style>
  :root { --text: #1d1d1f; --muted: #6e6e73; --line: #e5e5ea; --bg: #ffffff; --accent: #ff616d; }
  @media (prefers-color-scheme: dark) {
    :root { --text: #f5f5f7; --muted: #a1a1a6; --line: #2c2c2e; --bg: #111113; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 64px 16px 96px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 48px; }
  .key { width: 40px; height: 40px; border-radius: 9px; background: #3a3c43; color: #fff;
         font: 600 13px/1 -apple-system, sans-serif; display: flex; align-items: flex-start;
         justify-content: flex-end; padding: 7px 8px; }
  header a { color: var(--text); text-decoration: none; font-weight: 600; font-size: 18px; }
  h1 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; }
  h2 { font-size: 17px; margin: 32px 0 4px; }
  p, li { color: var(--text); }
  .muted { color: var(--muted); font-size: 14px; }
  ul { padding-left: 20px; }
  a { color: var(--accent); }
  hr { border: 0; border-top: 1px solid var(--line); margin: 56px 0; }
  nav { margin-top: 56px; display: flex; gap: 20px; font-size: 14px; }
  nav a { color: var(--muted); text-decoration: none; }
</style>
</head>
<body>
<main>
<header><div class="key">fn</div><a href="/">VoiceFn</a></header>
{{template "content" .}}
<nav><a href="/">Home</a><a href="/privacy">Privacy</a><a href="/support">Support</a></nav>
</main>
</body>
</html>
{{end}}
