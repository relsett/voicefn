name: macOS CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    # The Icon Composer app icon (Resources/AppIcon.icon) needs Xcode 26 or later.
    runs-on: macos-26
    # WhisperKit is compiled twice (tests and the universal Release build).
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate scripts and project files
        run: |
          bash -n scripts/*.sh
          plutil -lint Resources/Info.plist Resources/VoiceMacro.entitlements VoiceMacro.xcodeproj/project.pbxproj
      - name: Cache Swift packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .build
            build/CI/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved', 'VoiceMacro.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
      - name: Run tests
        run: ./scripts/test.sh
      - name: Build macOS app without signing
        run: >-
          xcodebuild -project VoiceMacro.xcodeproj -scheme VoiceMacro
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath build/CI CODE_SIGNING_ALLOWED=NO build

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Test website server
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...
